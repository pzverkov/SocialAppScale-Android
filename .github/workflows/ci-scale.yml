name: SocialApp-scale

# Runs only when the scale project, the shared catalog, or these workflows change,
# so docs-only and basic-only changes skip the scale build entirely.
on:
  push:
    branches: [main]
    paths:
      - 'SocialApp-scale/**'
      - 'gradle/**'
      - '.github/workflows/ci-scale.yml'
      - '.github/workflows/verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'SocialApp-scale/**'
      - 'gradle/**'
      - '.github/workflows/ci-scale.yml'
      - '.github/workflows/verify.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      project: SocialApp-scale

  # Instrumentation tests run only for the scale project (the basic project keeps the lighter
  # verify-only gate), since the emulator path is slow and the modular variant carries the
  # navigation, deeplink, and favorite UI tests. The emulator has no AICore, so the on-device
  # AI path stays covered by unit tests with a fake; here it simply reports unavailable.
  instrumentation:
    name: instrumentation tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30-${{ runner.os }}

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          working-directory: SocialApp-scale
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports
          path: SocialApp-scale/app/build/reports/androidTests/
          retention-days: 7
          if-no-files-found: ignore

name: release

# Builds the unsigned SocialApp-scale release APK from a version tag, attests its provenance, and
# publishes it with a checksum. The tag must match versionName and have a CHANGELOG section.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: build, attest, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag, versionName and changelog agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' SocialApp-scale/app/build.gradle.kts)
          [ "$name" = "$version" ] || { echo "tag $TAG does not match versionName $name"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## /{f=0} f' CHANGELOG.md > release-notes.md

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build release APK
        working-directory: SocialApp-scale
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Name the APK and write its checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp SocialApp-scale/app/build/outputs/apk/release/app-release-unsigned.apk "socialapp-scale-$TAG-unsigned.apk"
          sha256sum "socialapp-scale-$TAG-unsigned.apk" > "socialapp-scale-$TAG-unsigned.apk.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: socialapp-scale-${{ github.ref_name }}-unsigned.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag \
            "socialapp-scale-$TAG-unsigned.apk" "socialapp-scale-$TAG-unsigned.apk.sha256"

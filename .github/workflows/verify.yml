name: verify

# Reusable build-and-verify job, called per project by the path-filtered CI
# workflows so each variant runs the same quality gate.
on:
  workflow_call:
    inputs:
      project:
        description: Project directory to build (SocialApp-basic or SocialApp-scale).
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: lint, test, coverage, assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle home (dependencies, wrapper) and the build cache, and
      # restores it on pull requests from the main branch.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Lint, test, coverage gate, assemble
        working-directory: ${{ inputs.project }}
        run: ./gradlew lintDebug testDebugUnitTest koverVerify assembleDebug --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ inputs.project }}
          path: ${{ inputs.project }}/app/build/reports/
          retention-days: 7
          if-no-files-found: ignore

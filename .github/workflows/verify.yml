name: verify

# Reusable build-and-verify job, called per project by the path-filtered CI
# workflows so each variant runs the same quality gate.
on:
  workflow_call:
    inputs:
      project:
        description: Project directory to build (SocialApp-basic or SocialApp-scale).
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: lint, test, coverage, assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle home (dependencies, wrapper) and the build cache, and
      # restores it on pull requests from the main branch.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint, test, coverage gate, assemble
        working-directory: ${{ inputs.project }}
        run: ./gradlew lintDebug testDebugUnitTest koverVerify assembleDebug --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ inputs.project }}
          path: ${{ inputs.project }}/app/build/reports/
          retention-days: 7
          if-no-files-found: ignore

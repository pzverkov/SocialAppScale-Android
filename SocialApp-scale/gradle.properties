# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Build performance: reuse task outputs across builds (local build cache), skip
# the configuration phase when nothing relevant changed (configuration cache),
# and build independent modules in parallel. The payoff grows as the project
# splits into :core and :feature modules, where only changed modules rebuild.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Enable Gradle to auto-download JDK for toolchain if not available locally
org.gradle.java.installations.auto-download=true

# Use Daemon toolchain to align JVM selection between CLI and IDE. The build daemon runs on
# JDK 21 (compile targets stay at JVM 17) so SDK 36 screenshot tooling (Robolectric/Roborazzi)
# and other JDK-21-only tooling can run; the daemon JVM auto-provisions via the foojay resolver.
org.gradle.daemon.jvm.toolchain.version=21
